# tmux.conf — session orchestrator config

# ── Prefix ──
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ──
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -s escape-time 0
set -g focus-events on

# ── Colors ──
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ── Pane splitting (intuitive keys) ──
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keeps current path
bind c new-window -c "#{pane_current_path}"

# ── Pane navigation (vim-style) ──
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resizing ──
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode (vi) ──
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Clipboard: auto-detect platform
if-shell "uname | grep -q Darwin" \
    "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'" \
    "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

# ── Reload config ──
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ── Status bar ──
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=white"

set -g status-left-length 30
set -g status-left "#[fg=cyan,bold] #S #[default]│ "

set -g status-right-length 50
set -g status-right "#[fg=white]%H:%M #[fg=cyan]%Y-%m-%d"

setw -g window-status-format "#[fg=grey] #I:#W "
setw -g window-status-current-format "#[fg=cyan,bold] #I:#W "

# ── Pane borders ──
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=cyan"
